<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Akan Name Generator</h1>
            <p class="description">Discover your unique Ghanaian Akan name! In Akan culture, children are traditionally named after the specific day of the week they were born. Enter your birth details below to find yours.</p>
        </header>

        <main>
            <form id="birthForm" novalidate>
                <div class="form-group">
                    <label for="birthdate">Date of Birth</label>
                   <input type="date" id="birthdate" name="birthdate" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="male" required>
                            <span>Male</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="female" required>
                            <span>Female</span>
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn">Generate Name</button>
            </form>

            <section id="resultSection" class="result-card hidden">
                <h2>Your Akan Name</h2>
                <p id="resultText"></p>
                <button type="button" id="clearBtn">Check Another Date</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Akan Name Generator. All Rights Reserved.</p>
            </footer>
</div>
<script src="script.js"></script>
</body>
</html>
